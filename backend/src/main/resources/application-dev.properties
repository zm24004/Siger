# =====================================================================
# SIGER — DEV profile
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/siger?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=siger_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari pool tuning (dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SIGER-specific settings
siger.jwt.secret=${JWT_SECRET}
siger.jwt.expiration-ms=86400000
siger.cors.origin=http://localhost:5173

logging.level.com.siger=DEBUG
logging.level.org.springframework.security=INFO
