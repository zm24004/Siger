# =====================================================================
# SIGER — PROD profile
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/siger?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:siger_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari pool tuning (prod)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# SIGER-specific settings
siger.jwt.secret=${JWT_SECRET}
siger.jwt.expiration-ms=86400000
siger.cors.origin=${SIGER_CORS_ORIGIN:https://siger.example.org}

logging.level.com.siger=INFO
logging.level.org.springframework.security=WARN
logging.level.root=INFO
