# =====================================================================
# SIGER — application.properties (base, shared by all profiles)
# =====================================================================
spring.application.name=siger-backend
spring.profiles.active=dev

server.port=8080
server.servlet.context-path=/

# Actuator: expose health & info (no env/secrets)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Keep camelCase column names matching the SQL schema
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Open-in-view disabled (we map entities to DTOs inside @Transactional services)
spring.jpa.open-in-view=false

# DDL: validate the existing schema, never auto-generate it
spring.jpa.hibernate.ddl-auto=validate

# Springdoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
