openapi: 3.0.3
info:
  title: SIGER API
  description: |
    API REST del Sistema de Gestión de Eventos y Reservas (SIGER).
    Los endpoints reflejan las rutas actualmente implementadas. La autenticación
    se realiza con JWT Bearer, salvo las operaciones públicas indicadas.
  version: 1.0.0
  contact:
    name: Equipo SIGER
servers:
  - url: http://localhost:8080
    description: Servidor local
x-websocket:
  endpoint: /api/v1/ws-notificaciones
  protocol: STOMP over WebSocket/SockJS
  authentication:
    frame: CONNECT
    header: Authorization
    scheme: Bearer
    tokenSource: JWT returned by the REST login endpoint
  subscriptions:
    - destination: /user/queue/notificaciones
      payload:
        $ref: '#/components/schemas/NotificacionResponse'
  description: |
    El cliente conecta a /api/v1/ws-notificaciones, autentica el frame STOMP CONNECT
    con el JWT de la API y se suscribe a /user/queue/notificaciones. Las
    notificaciones quedan persistidas y también están disponibles mediante
    los endpoints REST del usuario autenticado.
tags:
  - name: Autenticación
    description: Registro, inicio y administración de sesión.
  - name: Eventos
    description: Catálogo público, administración propia, cupos, recursos y cambios notificados por WebSocket.
  - name: Ubicaciones
    description: CRUD de ubicaciones, filtrado y consulta paginada.
  - name: Recursos
    description: CRUD y consulta paginada de recursos.
  - name: Reservaciones
    description: Reservaciones propias y administración.
  - name: Asistencias
    description: Registro de asistencia a eventos.
  - name: Notificaciones
    description: Notificaciones del usuario autenticado.
  - name: Reportes
    description: Generación, consulta y exportación de reportes propios o globales.
  - name: Estadísticas
    description: Métricas agregadas de eventos y reservaciones según alcance autorizado.
  - name: Usuarios
    description: Administración de usuarios.
  - name: Roles
    description: Consulta de roles y administración de permisos.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Autentica al usuario y devuelve un JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@ejemplo.com
              contrasena: MiClaveSegura123
      responses:
        '200':
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario registrado y autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: Revoca el JWT enviado en el encabezado Authorization.
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicitar recuperación de contraseña
      description: |
        Devuelve siempre un mensaje genérico para no revelar si el correo está
        registrado. Actualmente no envía correo ni inicia un flujo de recuperación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarContrasenaRequest'
      responses:
        '200':
          description: Respuesta genérica de recuperación.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Si existe una cuenta asociada, recibirás instrucciones para recuperar el acceso.
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar perfil autenticado
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/me/password:
    put:
      tags: [Autenticación]
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos:
    get:
      tags: [Eventos]
      summary: Listar catálogo de eventos
      description: |
        Operación pública. De forma predeterminada muestra eventos activos desde hoy.
        Puede filtrarse por intervalo de fechas, estado y ubicación.
      security: []
      parameters:
        - name: fechaDesde
          in: query
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          schema:
            type: string
            format: date
        - name: estado
          in: query
          description: Si se omite, se filtran eventos Activos.
          schema:
            type: string
        - name: idUbicacion
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Eventos que coinciden con los filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Eventos]
      summary: Crear evento
      description: Requiere el permiso `events:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoRequest'
      responses:
        '201':
          description: Evento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/mis-eventos:
    get:
      tags: [Eventos]
      summary: Listar eventos del organizador autenticado
      description: Requiere el permiso `events:manage`.
      responses:
        '200':
          description: Eventos del organizador autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organizadores/{id}/eventos:
    get:
      tags: [Eventos]
      summary: Listar eventos de un organizador
      description: El organizador solo puede consultar sus eventos; el administrador puede consultar cualquiera.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Eventos del organizador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}:
    get:
      tags: [Eventos]
      summary: Consultar evento
      description: Consulta pública del detalle de un evento.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Detalle del evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Eventos]
      summary: Actualizar evento
      description: Requiere `events:manage` y que el usuario sea el organizador dueño. No permite cambiar eventos cancelados o finalizados.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoRequest'
      responses:
        '200':
          description: Evento actualizado; se notifica a participantes con reservación activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}/disponibilidad:
    get:
      tags: [Eventos]
      summary: Consultar cupos disponibles
      description: Cuenta las reservaciones pendientes, confirmadas y pausadas.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Capacidad, cupos ocupados y disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDisponibilidadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/eventos/{id}/cancelar:
    patch:
      tags: [Eventos]
      summary: Cancelar evento
      description: Requiere `events:manage` y ser el organizador dueño. Notifica a participantes con reservación activa.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Evento cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}/reprogramar:
    patch:
      tags: [Eventos]
      summary: Reprogramar evento
      description: Requiere `events:manage` y ser el organizador dueño. Notifica a participantes con reservación activa.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprogramarEventoRequest'
      responses:
        '200':
          description: Evento reprogramado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}/finalizar:
    patch:
      tags: [Eventos]
      summary: Finalizar evento
      description: Requiere `events:manage` y ser el organizador dueño. Notifica a participantes con reservación activa.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Evento finalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}/recursos:
    get:
      tags: [Eventos]
      summary: Listar recursos asignados
      description: Requiere `events:manage` y ser el organizador dueño.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Recursos y cantidades asignadas al evento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoRecursoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Eventos]
      summary: Asignar recurso al evento
      description: Requiere `events:manage`, ser el organizador dueño y que exista inventario disponible.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoRecursoRequest'
      responses:
        '201':
          description: Recurso asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/eventos/{id}/recursos/{idRecurso}:
    put:
      tags: [Eventos]
      summary: Actualizar cantidad del recurso asignado
      description: Requiere `events:manage`, ser el organizador dueño y que exista inventario disponible.
      parameters:
        - $ref: '#/components/parameters/IdLong'
        - name: idRecurso
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoRecursoCantidadRequest'
      responses:
        '200':
          description: Asignación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Eventos]
      summary: Quitar recurso del evento
      description: Requiere `events:manage` y ser el organizador dueño.
      parameters:
        - $ref: '#/components/parameters/IdLong'
        - name: idRecurso
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Recurso quitado del evento.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ubicaciones:
    get:
      tags: [Ubicaciones]
      summary: Listar ubicaciones
      description: Requiere el permiso `locations:read` (Administrador u Organizador).
      parameters:
        - name: tipo
          in: query
          required: false
          description: Filtra por tipo, sin distinguir mayúsculas y minúsculas.
          schema:
            type: string
            maxLength: 50
        - name: page
          in: query
          required: false
          description: Número de página, basado en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de elementos por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de ubicaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ubicaciones]
      summary: Crear ubicación
      description: Requiere el permiso `locations:create` (Administrador u Organizador).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UbicacionRequest'
      responses:
        '201':
          description: Ubicación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ubicaciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador positivo de la ubicación.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Ubicaciones]
      summary: Consultar ubicación
      description: Requiere el permiso `locations:read` (Administrador u Organizador).
      responses:
        '200':
          description: Ubicación encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ubicaciones]
      summary: Actualizar ubicación
      description: Requiere el permiso `locations:update` (Administrador u Organizador).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UbicacionRequest'
      responses:
        '200':
          description: Ubicación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Ubicaciones]
      summary: Eliminar ubicación
      description: |
        Requiere el permiso `locations:delete` (solo Administrador).
        No elimina ubicaciones asociadas a eventos.
      responses:
        '204':
          description: Ubicación eliminada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/recursos:
    get:
      tags: [Recursos]
      summary: Listar recursos
      description: Requiere el permiso `resources:read` (Administrador u Organizador).
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página, basado en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de elementos por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de recursos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Recursos]
      summary: Crear recurso
      description: Requiere el permiso `resources:create` (Administrador u Organizador).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/recursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador positivo del recurso.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Recursos]
      summary: Consultar recurso
      description: Requiere el permiso `resources:read` (Administrador u Organizador).
      responses:
        '200':
          description: Recurso encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Recursos]
      summary: Actualizar recurso
      description: Requiere el permiso `resources:update` (Administrador u Organizador).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoRequest'
      responses:
        '200':
          description: Recurso actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recursos]
      summary: Eliminar recurso
      description: |
        Requiere el permiso `resources:delete` (solo Administrador).
        No elimina recursos asignados a eventos.
      responses:
        '204':
          description: Recurso eliminado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/reservaciones:
    post:
      tags: [Reservaciones]
      summary: Reservar un cupo
      description: |
        Requiere `reservations:create`. La creación bloquea el evento en una transacción
        para evitar sobrecupos. Devuelve HTTP 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservacionRequest'
            example:
              idEvento: 12
      responses:
