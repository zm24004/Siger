          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        codigoPais:
          type: string
          maxLength: 10
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
        rol:
          type: string
    UsuarioUpdateRequest:
      type: object
      required: [nombre, apellido, email, telefono, codigoPais]
      properties:
