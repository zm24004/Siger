          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreateRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar usuario
      description: Requiere el permiso `users:read`.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '200':
          description: Datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      description: Requiere el permiso `users:update`.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario
      description: Requiere el permiso `users:delete`.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      responses:
        '204':
          description: Usuario eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Cambiar estado de usuario
      description: Requiere el permiso `users:state`.
      parameters:
        - $ref: '#/components/parameters/IdLong'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEstadoRequest'
      responses:
        '200':
          description: Estado de usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: Listar roles y permisos
      description: Requiere el permiso `roles:read`.
      responses:
        '200':
          description: Roles disponibles con sus permisos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/roles/{id}/permisos:
    put:
      tags: [Roles]
      summary: Actualizar permisos de un rol
      description: Requiere el permiso `roles:update`.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPermisosRequest'
      responses:
        '200':
          description: Rol actualizado con sus permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Introduce el JWT obtenido en POST /api/v1/auth/login.
  parameters:
    IdLong:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso.
      schema:
        type: integer
        format: int64
        minimum: 1
    FechaDesde:
      name: fechaDesde
      in: query
      required: false
      schema:
        type: string
        format: date
    FechaHasta:
      name: fechaHasta
      in: query
      required: false
      schema:
        type: string
        format: date
    IdEventoQuery:
      name: idEvento
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Solicitud inválida o datos que no cumplen las validaciones.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Falta autenticación o el token JWT no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no tiene el permiso requerido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No se encontró el recurso solicitado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio o de integridad de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [email, contrasena]
      properties:
        email:
          type: string
          format: email
          example: usuario@ejemplo.com
        contrasena:
          type: string
          format: password
          writeOnly: true
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT para enviar como Bearer token.
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        rol:
          type: string
        idUsuario:
          type: integer
          format: int64
    RegistroRequest:
      type: object
      required: [nombre, email, contrasena]
      properties:
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
          pattern: '^$|^[0-9+()\-\\s]{6,30}$'
        codigoPais:
          type: string
          nullable: true
          pattern: '^$|^\\+?[0-9]{1,4}$'
          example: '+503'
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
    RecuperarContrasenaRequest:
      type: object
      required: [email, nombreOAlias]
      properties:
        email:
          type: string
        nombreOAlias:
          type: string
    CambiarContrasenaRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
          format: password
          writeOnly: true
        contrasenaNueva:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
    EventoRequest:
      type: object
      required: [nombre, fecha, horaInicio, capacidadMaxima, idUbicacion]
      properties:
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          nullable: true
        fecha:
          type: string
          format: date
          description: Fecha actual o futura.
          example: '2026-12-15'
        horaInicio:
          type: string
          format: time
          example: '09:30:00'
        horaFin:
          type: string
          format: time
          nullable: true
          example: '12:00:00'
        capacidadMaxima:
          type: integer
          minimum: 1
        idUbicacion:
          type: integer
          format: int64
          minimum: 1
    ReprogramarEventoRequest:
      type: object
      required: [fecha, horaInicio]
      properties:
        fecha:
          type: string
          format: date
          description: Fecha actual o futura.
        horaInicio:
          type: string
          format: time
        horaFin:
          type: string
          format: time
          nullable: true
    EventoResponse:
      type: object
      required: [idEvento, nombre, fecha, horaInicio, capacidadMaxima, estado, cuposDisponibles]
      properties:
        idEvento:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
          format: time
        horaFin:
          type: string
          format: time
          nullable: true
        capacidadMaxima:
          type: integer
        estado:
          type: string
        idUbicacion:
          type: integer
          format: int64
        ubicacionNombre:
          type: string
          nullable: true
        idOrganizador:
          type: integer
          format: int64
          nullable: true
        organizadorNombre:
          type: string
          nullable: true
        cuposDisponibles:
          type: integer
          format: int64
    EventoDisponibilidadResponse:
      type: object
      required: [idEvento, capacidadMaxima, cuposOcupados, cuposDisponibles]
      properties:
        idEvento:
          type: integer
          format: int64
        capacidadMaxima:
          type: integer
        cuposOcupados:
          type: integer
          format: int64
        cuposDisponibles:
          type: integer
          format: int64
    EventoRecursoRequest:
      type: object
      required: [idRecurso, cantidadAsignada]
      properties:
        idRecurso:
          type: integer
          format: int64
          minimum: 1
        cantidadAsignada:
          type: integer
          minimum: 1
    EventoRecursoCantidadRequest:
      type: object
      required: [cantidadAsignada]
      properties:
        cantidadAsignada:
          type: integer
          minimum: 1
    EventoRecursoResponse:
      type: object
      required: [idEvento, idRecurso, nombreRecurso, cantidadAsignada]
      properties:
        idEvento:
          type: integer
          format: int64
        idRecurso:
          type: integer
          format: int64
        nombreRecurso:
          type: string
        cantidadAsignada:
          type: integer
    UbicacionRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        direccion:
          type: string
          nullable: true
          maxLength: 255
        tipo:
          type: string
          nullable: true
          maxLength: 50
          description: Si se omite o está vacío, el valor predeterminado es Presencial.
        enlaceVirtual:
          type: string
          nullable: true
          maxLength: 500
    UbicacionResponse:
      type: object
      required: [idUbicacion, nombre, tipo]
      properties:
        idUbicacion:
          type: integer
          format: int64
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        tipo:
          type: string
        enlaceVirtual:
          type: string
          nullable: true
    UbicacionPageResponse:
      type: object
      description: Resultado paginado de ubicaciones.
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UbicacionResponse'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    RecursoRequest:
      type: object
      required: [nombre, cantidad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
          minimum: 1
        tipo:
          type: string
          nullable: true
          maxLength: 50
          description: Si se omite o está vacío, el valor predeterminado es General.
        estado:
          type: string
          nullable: true
          maxLength: 20
          description: Si se omite o está vacío, el valor predeterminado es Disponible.
    RecursoResponse:
      type: object
      required: [idRecurso, nombre, cantidad, tipo, estado]
      properties:
        idRecurso:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
        tipo:
          type: string
        estado:
          type: string
    RecursoPageResponse:
      type: object
      description: Resultado paginado de recursos.
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RecursoResponse'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ReservacionResponse:
      type: object
      properties:
        idReservacion:
          type: integer
          format: int64
        codigoReservacion:
          type: string
        estado:
          type: string
        fechaReservacion:
          type: string
          format: date
        idEvento:
          type: integer
          format: int64
        eventoNombre:
          type: string
          nullable: true
        eventoFecha:
          type: string
          format: date
          nullable: true
        eventoHoraInicio:
          type: string
          format: time
          nullable: true
        participanteNombre:
          type: string
          nullable: true
    ReservacionRequest:
      type: object
      required: [idEvento]
      properties:
        idEvento:
          type: integer
          format: int64
          minimum: 1
    AsistenciaRequest:
      type: object
      required: [codigoReservacion]
      properties:
        codigoReservacion:
          type: string
          minLength: 1
    AsistenciaUpdateRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [Presente, Ausente]
    AsistenciaResponse:
      type: object
      properties:
        idAsistencia:
          type: integer
          format: int64
        estado:
          type: string
        fechaAsistencia:
          type: string
          format: date
        horaAsistencia:
          type: string
          format: time
        idEvento:
          type: integer
          format: int64
        eventoNombre:
          type: string
          nullable: true
        codigoReservacion:
          type: string
        participanteNombre:
          type: string
    NotificacionResponse:
      type: object
      properties:
        idNotificacion:
          type: integer
          format: int64
        mensaje:
          type: string
        tipo:
          type: string
        leido:
          type: boolean
        fechaEnvio:
          type: string
          format: date-time
    NotificacionEnvioRequest:
      type: object
      required: [idEvento]
      properties:
        idEvento:
          type: integer
          format: int64
          minimum: 1
        mensaje:
          type: string
          maxLength: 1000
          description: Si se omite, el backend genera el texto recordatorio.
    NotificacionEnvioResponse:
      type: object
      properties:
        idEvento:
          type: integer
          format: int64
        notificacionesEnviadas:
          type: integer
          minimum: 0
    ReporteRequest:
      type: object
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [PARTICIPACION, EVENTOS_MAS_CONCURRIDOS, RESERVACIONES]
        fechaDesde:
          type: string
          format: date
          nullable: true
        fechaHasta:
          type: string
          format: date
          nullable: true
        idEvento:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    ReporteResponse:
      type: object
      properties:
        idReporte:
          type: integer
          format: int64
        tipo:
          type: string
        parametro:
          type: string
          nullable: true
        contenido:
          type: string
          description: Contenido del reporte serializado en JSON.
        fechaGeneracion:
          type: string
          format: date-time
        idCreador:
          type: integer
          format: int64
        nombreCreador:
          type: string
    EstadisticaEventoResponse:
      type: object
      properties:
        idEvento:
          type: integer
          format: int64
        nombre:
          type: string
        fecha:
          type: string
          format: date
        capacidadMaxima:
          type: integer
        reservacionesActivas:
          type: integer
          format: int64
        asistentes:
          type: integer
          format: int64
    EstadisticaParticipacionResponse:
      type: object
      properties:
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EstadisticaEventoResponse'
        totalReservaciones:
          type: integer
          format: int64
        totalAsistentes:
          type: integer
          format: int64
    EstadisticaRankingResponse:
      type: object
      properties:
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EstadisticaEventoResponse'
    ReservacionesPorEstadoResponse:
      type: object
      properties:
        estado:
          type: string
        total:
          type: integer
          format: int64
    EstadisticaReservacionesResponse:
      type: object
      properties:
        porEstado:
          type: array
          items:
            $ref: '#/components/schemas/ReservacionesPorEstadoResponse'
        total:
          type: integer
          format: int64
    EstadisticaDashboardResponse:
      type: object
      properties:
        totalEventos:
          type: integer
          format: int64
        totalReservaciones:
          type: integer
          format: int64
        totalAsistentes:
          type: integer
          format: int64
        porcentajeAsistencia:
          type: number
          format: double
    UsuarioCreateRequest:
      type: object
      required: [nombre, apellido, email, telefono, codigoPais, contrasena, rol]
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        codigoPais:
          type: string
          maxLength: 10
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
        rol:
          type: string
    UsuarioUpdateRequest:
      type: object
      required: [nombre, apellido, email, telefono, codigoPais]
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        codigoPais:
          type: string
          maxLength: 10
    UsuarioEstadoRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: boolean
    UsuarioResponse:
      type: object
      properties:
        idUsuario:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        codigoPais:
          type: string
          nullable: true
        estado:
          type: boolean
        rol:
          type: string
        fechaRegistro:
          type: string
          format: date-time
    UsuarioPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioResponse'
        page:
          type: integer
        limit:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    RolResponse:
      type: object
      properties:
        idRol:
          type: string
        nombre:
          type: string
        permisos:
          type: array
          items:
            $ref: '#/components/schemas/PermisoResponse'
    PermisoResponse:
      type: object
      properties:
        idPermiso:
          type: string
        descripcion:
          type: string
          nullable: true
    ActualizarPermisosRequest:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          uniqueItems: true
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
