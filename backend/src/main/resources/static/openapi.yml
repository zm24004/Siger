          type: integer
          format: int64
        totalPages:
          type: integer
    RolResponse:
      type: object
      properties:
        idRol:
          type: string
        nombre:
          type: string
        permisos:
          type: array
          items:
            $ref: '#/components/schemas/PermisoResponse'
    PermisoResponse:
      type: object
      properties:
        idPermiso:
          type: string
        descripcion:
          type: string
          nullable: true
    ActualizarPermisosRequest:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          uniqueItems: true
          items:
