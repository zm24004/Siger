# =====================================================================
# SIGER - Perfil TEST (Testcontainers MySQL)
# =====================================================================
# La URL, usuario y clave del datasource los inyecta TestContainersBase
# dinamicamente via @DynamicPropertySource (contenedor MySQL 8 real).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Crear el esquema desde las entidades JPA (no depende de siger.sql en tests).
# Las entidades usan PhysicalNamingStrategyStandardImpl => columnas camelCase,
# identicas al esquema de produccion.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Requerido por SecurityConfig / JwtService cuando @SpringBootTest carga el
# contexto completo (test de concurrencia). El secreto debe tener >=32 bytes.
siger.jwt.secret=clave-secreta-de-prueba-de-al-menos-32-caracteres-siger
siger.jwt.expiration-ms=3600000
siger.cors.origin=http://localhost:5173

logging.level.com.siger=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
